<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenting — lemma-md</title>

<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<!-- reveal.js layout first, then the app's own tokens and markdown styles, then
     the presentation theme built on top of them. No reveal theme is vendored —
     present.css is the theme. -->
<link rel="stylesheet" href="../vendor/reveal/reset.min.css">
<link rel="stylesheet" href="../vendor/reveal/reveal.min.css">
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../src/theme.css">
<link rel="stylesheet" href="../src/markdown.css">
<link rel="stylesheet" href="../src/slides.css">
<link rel="stylesheet" href="../src/present.css">
<link rel="stylesheet" href="../src/pdf-preview.css">

<!-- Vendored globals: the same three viewer.js expects, plus reveal.js (UMD,
     exposes `Reveal`). Our own code in src/ is ES modules. -->
<script src="../vendor/marked.min.js"></script>
<script src="../vendor/purify.min.js"></script>
<script src="../vendor/katex/katex.min.js"></script>
<script src="../vendor/reveal/reveal.min.js"></script>
</head>

<body>

<div class="reveal">
  <div class="slides" id="slides"></div>
</div>

<!-- Shown instead of the deck when there is no note to present, or it is empty
     or missing. Filled by present.js. -->
<div id="message" hidden></div>

<script type="module" src="../src/present/present.js"></script>
</body>
</html>
