<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lemma-md tests</title>

<!-- The same vendored globals the editor loads, so the app's modules run here
     exactly as they run there. -->
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<script src="../../vendor/marked.min.js"></script>
<script src="../../vendor/purify.min.js"></script>
<script src="../../vendor/katex/katex.min.js"></script>

<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; color: #1a1a1a; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .how { color: #6a737d; margin: 0 0 16px; }
  .summary { font-weight: 600; font-size: 16px; }
  .summary.pass { color: #1a7f37; }
  .summary.fail { color: #cf222e; }
  ol { padding-left: 1.6em; }
  li.pass span { color: #1a7f37; }
  li.fail span { color: #cf222e; font-weight: 600; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #fff1f0; padding: 6px 10px; border-radius: 6px; margin: 4px 0 10px; }
  #scratch { position: fixed; left: -10000px; top: 0; width: 800px; height: 600px; }
</style>
</head>
<body>

<h1>lemma-md tests</h1>
<p class="how">
  Served from the repository root, as the site is: start the server with
  <code>_tools/lemma_start</code> and open <code>http://localhost:8001/_tools/tests/</code>.
  <code>?only=tex,render</code> runs only those files, while working on them.
  Nothing here is published: Jekyll skips <code>_tools/</code>.
</p>

<div id="results"></div>
<!-- Where tests put iframes they need, out of sight. -->
<div id="scratch"></div>

<script>
  // Whatever loads src/drafts.js on this page uses a test database, never the
  // notes kept on this origin. The storage tests give each test its own.
  globalThis.lemmaTestDatabase = 'lemma-md-test'
</script>

<script type="module">
  import { refresh } from './fresh.js'

  const TESTS = [
    './render.test.js',
    './delimiters.test.js',
    './export.test.js',
    './tex.test.js',
    './slides.test.js',
    './help.test.js',
    './storage.test.js',
    './editor.test.js',
    './presentations.test.js',
  ]

  // ?only=tex,render runs those files alone, while working on them. A change is
  // done when the page has run everything, without it.
  const name = (file) => file.slice(2, -'.test.js'.length)
  const only = new URLSearchParams(location.search).get('only')?.split(',').map((s) => s.trim()).filter(Boolean) ?? null
  const unknown = (only ?? []).filter((n) => !TESTS.some((file) => name(file) === n))
  if (unknown.length) {
    document.title = `FAIL: no tests named ${unknown.join(', ')}`
    document.getElementById('results').textContent = `${document.title}. The files are: ${TESTS.map(name).join(', ')}.`
    throw new Error(document.title)
  }
  const chosen = only ? TESTS.filter((file) => only.includes(name(file))) : TESTS

  // Load what is on disk, not what the browser cached before the last edit.
  // The editor tests run the whole app in a frame, so its modules too.
  await refresh([...chosen, '../../src/app.js', '../../src/presentations.js', './fake-drive.js'])
  const { run } = await import('./runner.js')
  for (const file of chosen) await import(file)
  run(document.getElementById('results'), { only })
</script>

</body>
</html>
